syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "OtpService.Grpc";

package otp;

service OtpManager {
  rpc GenerateOtp (GenerateOtpRequest) returns (GenerateOtpResponse);
  rpc ValidateOtp (ValidateOtpRequest) returns (ValidateOtpResponse);
}

message GenerateOtpRequest {
  string identifier = 1; // phone / email (opaque string)
}

message GenerateOtpResponse {
  string request_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ValidateOtpRequest {
  string request_id = 1;
  string code = 2;
}

message ValidateOtpResponse {
  ValidationStatus status = 1;
}

enum ValidationStatus {
  VALID = 0;
  NOT_FOUND = 1;
  INVALID_CODE = 2;
  EXPIRED = 3;
  ALREADY_USED = 4;
  TOO_MANY_ATTEMPTS = 5;
  IDENTIFIER_FROZEN = 6;
}
